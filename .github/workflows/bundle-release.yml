name: Bundle Release

on:
  workflow_run:
    workflows:
      - CI Build
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bundle-release-main
  cancel-in-progress: false

jobs:
  version-gate:
    name: Check release version
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{
        (
          github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.head_branch == 'main'
        ) ||
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == 'refs/heads/main'
        )
      }}
    outputs:
      release_needed: ${{ steps.version.outputs.release_needed }}
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      release_sha: ${{ steps.version.outputs.release_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0

      - name: Validate version metadata
        id: version
        env:
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const { execFileSync } = require('node:child_process');

          const cargoToml = fs.readFileSync('src-tauri/Cargo.toml', 'utf8');
          const cargoVersionMatch = cargoToml.match(/^version\s*=\s*"([^"]+)"/m);

          if (!cargoVersionMatch) {
            throw new Error('Unable to read version from src-tauri/Cargo.toml');
          }

          const version = cargoVersionMatch[1];

          if (!/^\d+\.\d+\.\d+$/.test(version)) {
            throw new Error(`Version must use X.Y.Z format before creating a release tag: ${version}`);
          }

          const tagName = `v${version}`;
          let releaseNeeded = 'true';

          try {
            execFileSync('git', ['ls-remote', '--exit-code', '--tags', 'origin', `refs/tags/${tagName}`], { stdio: 'ignore' });
            releaseNeeded = 'false';
            console.log(`Release tag ${tagName} already exists; skipping bundle release.`);
          } catch {
            console.log(`Release tag ${tagName} does not exist; bundle release will run.`);
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_needed=${releaseNeeded}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `tag_name=${tagName}\n`);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `release_sha=${process.env.RELEASE_SHA}\n`);
          NODE

  build-macos:
    name: Build macOS
    needs: version-gate
    if: needs.version-gate.outputs.release_needed == 'true'
    uses: ./.github/workflows/bundle-release-macos.yml
    with:
      version: ${{ needs.version-gate.outputs.version }}
      release_sha: ${{ needs.version-gate.outputs.release_sha }}
    secrets: inherit

  build-windows-store:
    name: Build Windows Store MSIX
    needs: version-gate
    if: needs.version-gate.outputs.release_needed == 'true'
    uses: ./.github/workflows/bundle-release-windows.yml
    with:
      version: ${{ needs.version-gate.outputs.version }}
      release_sha: ${{ needs.version-gate.outputs.release_sha }}
    secrets: inherit

  publish-release:
    name: Publish GitHub Release
    needs:
      - version-gate
      - build-macos
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: needs.version-gate.outputs.release_needed == 'true'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG_NAME: ${{ needs.version-gate.outputs.tag_name }}
      APP_VERSION: ${{ needs.version-gate.outputs.version }}
      RELEASE_SHA: ${{ needs.version-gate.outputs.release_sha }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version-gate.outputs.release_sha }}
          fetch-depth: 0

      - name: Download macOS release assets
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: mediaflow-macos-*
          merge-multiple: true

      - name: Create release tag
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG_NAME" > /dev/null 2>&1; then
            echo "Release tag $TAG_NAME already exists; leaving it unchanged."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG_NAME" "$RELEASE_SHA" -m "Release $TAG_NAME"
          git push origin "$TAG_NAME"

      - name: Create GitHub release
        run: |
          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "MediaFlow $TAG_NAME"
          else
            gh release create "$TAG_NAME" --title "MediaFlow $TAG_NAME" --generate-notes
          fi

      - name: Generate updater manifest
        env:
          RELEASE_ASSETS_DIR: release-assets
          UPDATER_MANIFEST_PATH: release-assets/latest.json
          PUB_DATE: ${{ github.event.workflow_run.updated_at || github.event.repository.updated_at }}
        run: node scripts/generate-updater-manifest.mjs

      - name: Upload release assets
        run: |
          gh release upload "$TAG_NAME" release-assets/* --clobber
