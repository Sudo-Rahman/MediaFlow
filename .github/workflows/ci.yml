name: CI Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25.8.1
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend
        run: pnpm check

      - name: Run frontend tests
        run: pnpm test

      - name: Run updater manifest tests
        run: pnpm test:updater-manifest

      - name: Run Windows Store MSIX tests
        run: pnpm test:windows-store-msix

  linux:
    uses: ./.github/workflows/ci-linux.yml

  macos:
    uses: ./.github/workflows/ci-macos.yml

  windows:
    uses: ./.github/workflows/ci-windows.yml
