name: Bundle Release macOS

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    name: Build macOS ${{ matrix.name }}
    runs-on: macos-15
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Apple Silicon
            target: aarch64-apple-darwin
            artifact_suffix: arm64
          - name: Intel
            target: x86_64-apple-darwin
            artifact_suffix: intel
    env:
      CI: true
      APP_VERSION: ${{ inputs.version }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25.8.1
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install macOS Rust target
        run: rustup target add ${{ matrix.target }}

      - name: Cache FFmpeg sidecar binaries
        uses: ./.github/actions/cache-ffmpeg-sidecars
        with:
          target: ${{ matrix.target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-macos-${{ matrix.target }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare Apple signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          CERTIFICATE_PATH="$RUNNER_TEMP/mediaflow-signing.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/mediaflow-signing.keychain-db"
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY}.p8"

          printf '%s' "$APPLE_CERTIFICATE" | base64 -D -o "$CERTIFICATE_PATH"
          printf '%s' "$APPLE_API_PRIVATE_KEY" > "$API_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          echo "APPLE_API_KEY_PATH=${API_KEY_PATH}" >> "$GITHUB_ENV"
          echo "KEYCHAIN_PATH=${KEYCHAIN_PATH}" >> "$GITHUB_ENV"

      - name: Build signed app bundle
        run: pnpm tauri build --target ${{ matrix.target }}

      - name: Collect release asset
        run: |
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG_PATH=$(find "$BUNDLE_DIR/dmg" -name '*.dmg' -print -quit)
          APP_PATH=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app' -print -quit)
          UPDATER_ARCHIVE=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name '*.app.tar.gz' -print -quit)
          UPDATER_SIGNATURE="${UPDATER_ARCHIVE}.sig"

          test -n "$DMG_PATH"
          test -n "$APP_PATH"
          test -n "$UPDATER_ARCHIVE"
          test -f "$UPDATER_SIGNATURE"

          mkdir -p release-assets
          RELEASE_DMG="release-assets/MediaFlow_${APP_VERSION}_macos_${{ matrix.artifact_suffix }}.dmg"
          RELEASE_UPDATER="release-assets/MediaFlow_${APP_VERSION}_macos_${{ matrix.artifact_suffix }}.app.tar.gz"
          cp "$DMG_PATH" "$RELEASE_DMG"
          cp "$UPDATER_ARCHIVE" "$RELEASE_UPDATER"
          cp "$UPDATER_SIGNATURE" "${RELEASE_UPDATER}.sig"

          echo "APP_PATH=${APP_PATH}" >> "$GITHUB_ENV"
          echo "DMG_PATH=${RELEASE_DMG}" >> "$GITHUB_ENV"

      - name: Notarize and staple DMG
        run: |
          xcrun notarytool submit "$DMG_PATH" \
            --key "$APPLE_API_KEY_PATH" \
            --key-id "$APPLE_API_KEY" \
            --issuer "$APPLE_API_ISSUER" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Verify code signing and notarization
        run: |
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          xcrun stapler validate "$DMG_PATH"
          spctl -a -vv --type exec "$APP_PATH"

      - name: Upload macOS release artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaflow-macos-${{ matrix.artifact_suffix }}
          path: release-assets/*
          if-no-files-found: error

      - name: Cleanup signing assets
        if: always()
        run: |
          rm -f "$APPLE_API_KEY_PATH"
          security delete-keychain "$KEYCHAIN_PATH" || true
