name: Bundle Release Windows

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      release_sha:
        required: true
        type: string

permissions:
  contents: read

jobs:
  build-windows-store:
    name: Build Windows Store MSIX
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      APP_VERSION: ${{ inputs.version }}
      MICROSOFT_STORE_PACKAGE_IDENTITY_NAME: ${{ vars.MICROSOFT_STORE_PACKAGE_IDENTITY_NAME || secrets.MICROSOFT_STORE_PACKAGE_IDENTITY_NAME }}
      MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER: ${{ vars.MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER || secrets.MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER }}
      MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME || secrets.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Checkout release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.release_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25.8.1
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache FFmpeg sidecar binaries
        uses: ./.github/actions/cache-ffmpeg-sidecars
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target
          shared-key: release-windows-store-x64

      - name: Install Visual C++ Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          choco install vcredist140 -y

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Fix Vulkan lib naming
        shell: pwsh
        run: |
          $vulkanLib = Join-Path $env:VULKAN_SDK "lib"
          $vulkanBin = Join-Path $env:VULKAN_SDK "Bin"
          if (Test-Path "$vulkanLib\vulkan-1.lib") {
            Copy-Item "$vulkanLib\vulkan-1.lib" "$vulkanLib\vulkan.lib"
            Write-Host "Created vulkan.lib from vulkan-1.lib in $vulkanLib"
          }
          echo "LIB=$vulkanLib;$env:LIB" >> $env:GITHUB_ENV
          echo "$vulkanBin" >> $env:GITHUB_PATH

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile

      - name: Validate Microsoft Store release variables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $requiredVariables = @(
            "MICROSOFT_STORE_PACKAGE_IDENTITY_NAME",
            "MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER",
            "MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME"
          )
          $missingVariables = @()

          foreach ($name in $requiredVariables) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missingVariables += $name
            }
          }

          if ($missingVariables.Count -gt 0) {
            throw "Missing required workflow variables: $($missingVariables -join ', ')"
          }

      - name: Check frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm check

      - name: Run frontend tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm test

      - name: Run updater manifest tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm test:updater-manifest

      - name: Run Windows Store MSIX tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm test:windows-store-msix

      - name: Build Windows x64 Microsoft Store flavor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:VITE_MEDIAFLOW_DISTRIBUTION = "microsoft-store"
          pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc --features microsoft-store --config src-tauri/tauri.microsoft-store.conf.json

      - name: Stage Windows Store MSIX layout
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/stage-windows-store-msix.mjs

      - name: Setup WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Pack MSIX with WinApp CLI
        id: pack
        shell: pwsh
        env:
          MSIX_STAGE_DIR: ${{ steps.stage.outputs.msix_stage_dir }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "dist\windows-store-release"
          $outputName = "MediaFlow_${env:APP_VERSION}_windows_store_x64.msix"
          $outputPath = Join-Path $outputDir $outputName

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          Push-Location $outputDir
          try {
            winapp pack "$env:MSIX_STAGE_DIR" --output $outputName
          } finally {
            Pop-Location
          }

          if (!(Test-Path $outputPath)) {
            throw "WinApp CLI did not create the expected MSIX: $outputPath"
          }

          "msix_path=$outputPath" >> $env:GITHUB_OUTPUT

      - name: Upload Windows Store MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaflow-windows-store-msix
          path: ${{ steps.pack.outputs.msix_path }}
          if-no-files-found: error
