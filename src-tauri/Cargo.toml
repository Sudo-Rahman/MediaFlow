[package]
name = "Mediaflow"
version = "1.0.3"
description = "A Tauri App"
authors = ["Rahman YILMAZ"]
edition = "2024"
license-file = "../LICENSE"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mediaflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
microsoft-store = []

[build-dependencies]
tauri-build = { version = "^2", features = [] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
tar = "0.4"
walkdir = "2.5"
xz2 = "0.1"
zip = "8.2"

[dependencies]
tauri = { version =  "^2", features = ["protocol-asset", "macos-private-api", "default"] }
tauri-plugin-opener =  "^2"
tauri-plugin-store =  "^2"
tauri-plugin-shell =  "^2"
tauri-plugin-dialog =  "^2"
tauri-plugin-fs =  "^2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.48.0", features = ["full"] }
tiktoken-rs = "0.9"
image = "0.25"
rayon = "1.10"
num_cpus = "1.16"
oxideav-core = "0.1"
oxideav-codec = "0.1"
oxideav-container = "0.1"
oxideav-sub-image = "0.0.7"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
futures-util = "0.3"
zip = "8.2"
tar = "0.4"
xz2 = "0.1"
walkdir = "2.5"
tauri-plugin-deep-link = "^2"
tauri-plugin-single-instance = { version = "^2", features = ["deep-link"] }
tauri-plugin-updater = "^2"
tauri-plugin-process = "^2"

#windows or linux ocr
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
ocr-rs = { git = "https://github.com/zibo-chen/rust-paddle-ocr.git", branch = "next", features = ["vulkan"] }


[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "^3", features = ["apple-native"] }
cocoa = "0.26.0"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSColor", "NSView", "NSWindow", "objc2-quartz-core"] }
objc2-core-foundation = { version = "0.3.2", default-features = false }
objc2-quartz-core = { version = "0.3.2", default-features = false, features = ["CALayer", "objc2-core-foundation"] }
# OCR
ocr-rs = { git = "https://github.com/zibo-chen/rust-paddle-ocr.git", branch = "next", features = ["metal"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "^3", features = ["windows-native"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm"
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "^3", features = ["sync-secret-service", "crypto-rust"] }
zbus = "5.12"


[dev-dependencies]
ctor = "0.2"
serial_test = "3.2"
sha2 = "0.10"
tempfile = "3.20"
