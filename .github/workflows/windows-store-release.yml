# Required repository variables or secrets:
# - MICROSOFT_STORE_PRODUCT_ID
# - MICROSOFT_STORE_PACKAGE_IDENTITY_NAME
# - MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER
# - MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME
#
# Required repository secrets for publishing:
# - AZURE_AD_APPLICATION_CLIENT_ID
# - AZURE_AD_APPLICATION_SECRET
# - AZURE_AD_TENANT_ID
# - SELLER_ID

name: Windows Store Release

on:
  pull_request:
    paths:
      - ".github/workflows/windows-store-release.yml"
      - "package.json"
      - "pnpm-lock.yaml"
      - "svelte.config.js"
      - "vite.config.js"
      - "scripts/stage-windows-store-msix.mjs"
      - "scripts/stage-windows-store-msix.node-test.mjs"
      - "src/**"
      - "src-tauri/**"
  workflow_dispatch:
    inputs:
      flight_id:
        description: Microsoft Store package flight ID.
        required: true
        default: PrivateWindowsX64
        type: string
      publish_flight:
        description: Publish the generated MSIX to the selected Partner Center flight.
        required: true
        default: false
        type: boolean
      poll_flight:
        description: Wait for the selected flight publishing operation to finish.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.flight_id || 'PrivateWindowsX64' }}
  cancel-in-progress: false

jobs:
  build-stage-pack:
    name: Build, stage, and pack Windows Store MSIX
    runs-on: windows-latest
    environment: windows-store-release
    timeout-minutes: 120
    env:
      FLIGHT_ID: ${{ inputs.flight_id || 'PrivateWindowsX64' }}
      MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID }}
      MICROSOFT_STORE_PACKAGE_IDENTITY_NAME: ${{ vars.MICROSOFT_STORE_PACKAGE_IDENTITY_NAME || secrets.MICROSOFT_STORE_PACKAGE_IDENTITY_NAME }}
      MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER: ${{ vars.MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER || secrets.MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER }}
      MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME: ${{ vars.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME || secrets.MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 25.8.1
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache FFmpeg sidecar binaries
        uses: ./.github/actions/cache-ffmpeg-sidecars
        with:
          target: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2.9.1
        with:
          workspaces: src-tauri -> target

      - name: Install Visual C++ Runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          choco install vcredist140 -y

      - name: Setup Vulkan SDK
        uses: humbletim/setup-vulkan-sdk@v1.2.1
        with:
          vulkan-query-version: 1.3.296.0
          vulkan-components: Vulkan-Headers, Vulkan-Loader
          vulkan-use-cache: true

      - name: Fix Vulkan lib naming
        shell: pwsh
        run: |
          $vulkanLib = Join-Path $env:VULKAN_SDK "lib"
          $vulkanBin = Join-Path $env:VULKAN_SDK "Bin"
          if (Test-Path "$vulkanLib\vulkan-1.lib") {
            Copy-Item "$vulkanLib\vulkan-1.lib" "$vulkanLib\vulkan.lib"
            Write-Host "Created vulkan.lib from vulkan-1.lib in $vulkanLib"
          }
          echo "LIB=$vulkanLib;$env:LIB" >> $env:GITHUB_ENV
          echo "$vulkanBin" >> $env:GITHUB_PATH

      - name: Install dependencies
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm install --frozen-lockfile

      - name: Validate Microsoft Store release variables
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $requiredVariables = @(
            "MICROSOFT_STORE_PRODUCT_ID",
            "MICROSOFT_STORE_PACKAGE_IDENTITY_NAME",
            "MICROSOFT_STORE_PACKAGE_IDENTITY_PUBLISHER",
            "MICROSOFT_STORE_PUBLISHER_DISPLAY_NAME",
            "FLIGHT_ID"
          )
          $missingVariables = @()

          foreach ($name in $requiredVariables) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              $missingVariables += $name
            }
          }

          if ($missingVariables.Count -gt 0) {
            throw "Missing required workflow variables: $($missingVariables -join ', ')"
          }

      - name: Check frontend
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm check

      - name: Run frontend tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm test

      - name: Run updater manifest tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm test:updater-manifest

      - name: Run Windows Store MSIX tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          pnpm test:windows-store-msix

      - name: Build Windows x64 Microsoft Store flavor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $env:VITE_MEDIAFLOW_DISTRIBUTION = "microsoft-store"
          pnpm tauri build --no-bundle --target x86_64-pc-windows-msvc --features microsoft-store --config src-tauri/tauri.microsoft-store.conf.json

      - name: Stage Windows Store MSIX layout
        id: stage
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          node scripts/stage-windows-store-msix.mjs

      - name: Setup WinApp CLI
        uses: microsoft/setup-WinAppCli@v0.1

      - name: Pack MSIX with WinApp CLI
        id: pack
        shell: pwsh
        env:
          MSIX_STAGE_DIR: ${{ steps.stage.outputs.msix_stage_dir }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "dist\windows-store-release"
          $outputName = "MediaFlow_${{ github.run_number }}_x64.msix"
          $outputPath = Join-Path $outputDir $outputName

          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null
          Push-Location $outputDir
          try {
            winapp pack "$env:MSIX_STAGE_DIR" --output $outputName
          } finally {
            Pop-Location
          }

          if (!(Test-Path $outputPath)) {
            throw "WinApp CLI did not create the expected MSIX: $outputPath"
          }

          "msix_path=$outputPath" >> $env:GITHUB_OUTPUT

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: mediaflow-windows-store-msix
          path: ${{ steps.pack.outputs.msix_path }}
          if-no-files-found: error

  publish-flight:
    name: Publish MSIX to Microsoft Store flight
    runs-on: windows-latest
    needs: build-stage-pack
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_flight == true && github.ref == 'refs/heads/main' }}
    environment: windows-store-release
    timeout-minutes: 60
    env:
      FLIGHT_ID: ${{ inputs.flight_id || 'PrivateWindowsX64' }}
      MICROSOFT_STORE_PRODUCT_ID: ${{ vars.MICROSOFT_STORE_PRODUCT_ID || secrets.MICROSOFT_STORE_PRODUCT_ID }}

    steps:
      - name: Download MSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: mediaflow-windows-store-msix
          path: dist/windows-store-release

      - name: Configure Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Reconfigure Microsoft Store credentials
        shell: pwsh
        env:
          AZURE_AD_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          AZURE_AD_APPLICATION_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          AZURE_AD_APPLICATION_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          msstore reconfigure `
            --tenantId "$env:AZURE_AD_TENANT_ID" `
            --sellerId "$env:SELLER_ID" `
            --clientId "$env:AZURE_AD_APPLICATION_CLIENT_ID" `
            --clientSecret "$env:AZURE_AD_APPLICATION_SECRET"

      - name: Publish MSIX to Microsoft Store flight
        id: publish
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $msixFiles = Get-ChildItem -Path "dist/windows-store-release" -Filter "*.msix" -File
          if ($msixFiles.Count -ne 1) {
            throw "Expected exactly one MSIX artifact, found $($msixFiles.Count)."
          }

          $msixPath = $msixFiles[0].FullName
          msstore publish "$env:GITHUB_WORKSPACE" `
            --inputFile "$msixPath" `
            --appId "$env:MICROSOFT_STORE_PRODUCT_ID" `
            --flightId "$env:FLIGHT_ID"

      - name: Poll Microsoft Store flight publishing
        if: ${{ inputs.poll_flight == true }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          msstore flights submission poll "$env:MICROSOFT_STORE_PRODUCT_ID" "$env:FLIGHT_ID"
